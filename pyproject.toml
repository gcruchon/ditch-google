[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ditch-google"
version = "0.1.0"
description = "Migrate your Google Photos library to Proton Photos, with metadata and albums intact."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gilles Cruchon" }]
keywords = ["google-photos", "proton", "proton-drive", "takeout", "migration", "rclone", "exiftool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.urls]
Homepage = "https://github.com/gcruchon/ditch-google"
Repository = "https://github.com/gcruchon/ditch-google"
Issues = "https://github.com/gcruchon/ditch-google/issues"
Changelog = "https://github.com/gcruchon/ditch-google/blob/main/CHANGELOG.md"

[project.scripts]
ditch-google = "ditch_google.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "commitizen>=3.27",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ditch_google"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "PTH",       # use pathlib
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "S",         # bandit
    "T20",       # no print (we use rich/typer)
]
ignore = [
    "S603",  # subprocess call - this tool's whole job is driving external binaries
    "S607",  # partial executable path - we resolve via PATH deliberately, see proc.py
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T20"]  # asserts and prints are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["ditch_google"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
files = ["src", "tests"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "requires_exiftool: needs a real exiftool binary on PATH",
    "requires_rclone: needs a real rclone binary on PATH",
    "requires_proton: needs a real, signed-in proton-drive CLI",
]

[tool.coverage.run]
source = ["src/ditch_google"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- commitizen

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
changelog_merge_prerelease = true
